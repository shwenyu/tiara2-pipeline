# Tiara2 v2.3.0: v2.1.3 sampling is frozen; only labels/model change.
hierarchy:
  version: "2.3.0"             # reserved: 2.3.1=virus, 2.3.2=calibration
  train_ready: "/ssd/shouhanyu/Tiara2/corpus_ready_v2_1_3_bpbalanced"
  metadata_tsv: "/data/shouhanyu/Tiara2_v2_3_0/metadata/hierarchical_labels.tsv"
  feature_root: "/ssd/shouhanyu/Tiara2_v2_3_0/cache/hierarchy_k7"
  model_root: "/data/shouhanyu/Tiara2_v2_3_0/models/v2.3.0"
  tfidf: "tiara/models/tfidf-models-v2.2.0/k7-first-stage"
  k: 7
  unknown_euk_policy: error
  reuse_exact_v213_fragments: true
  resample_nonvirus: false
