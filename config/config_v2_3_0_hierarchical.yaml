    alveolata: 0.12
    other_protist: 0.12
    stramenopiles: 0.10
    algae: 0.08
    metazoa_vertebrate: 0.10
  model:
    hidden: [2048, 1024]
    dropout: 0.2
    loss_weights: {root: 1.0, euk: 1.0, prok: 0.5, organelle: 0.5}
    epochs: 50
    batch_size: 1024
    learning_rate: 0.001
  minor_versions:
    "2.3.1":
      virus_enabled: true
      virus_dir: "/data/shouhanyu/Tiara2/evaluation"
      virus_ratio_search: [0.05, 0.10, 0.15]
      preserve_nonvirus_ratios: true
    "2.3.2":
